<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ferme">
<title>Ferme de Popos & Mimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --herbe:#1f3a2e; --herbe-2:#2f5a45; --lait:#f7f8f3; --carte:#ffffff;
  --foin:#e3b23c; --ciel:#3f7ca6; --rose:#c2577a; --texte:#1c2620; --gris:#66736b; --trait:#d9e0d6;
  --titre:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --corps:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif;
}
html[lang="ar"]{--titre:"Cairo",Tahoma,sans-serif;--corps:"Cairo",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--lait);color:var(--texte);font-family:var(--corps);font-size:16px;line-height:1.5}
header{background:var(--herbe);color:#fff;padding:24px 20px 22px}
.wrap{max-width:1000px;margin:0 auto}
.haut{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--titre);font-weight:800;font-size:clamp(26px,6vw,42px);margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:#c9dccd}
#langue{background:transparent;border:1.5px solid #6f9a82;color:#fff;padding:8px 14px;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--herbe-2);border-radius:10px;padding:8px 14px;font-size:14px}
.stat b{font-family:var(--titre);font-size:20px;margin-inline-end:6px;color:var(--foin)}
.barre{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;max-width:1000px;margin:0 auto}
.barre input,.barre select{flex:1 1 180px;padding:11px 12px;border:1.5px solid var(--trait);border-radius:10px;font:inherit;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.btn-p{background:var(--foin);color:var(--herbe)}
.btn-s{background:#fff;border:1.5px solid var(--trait);color:var(--texte)}
.btn-d{background:#fff;border:1.5px solid #e5b9c6;color:var(--rose)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ciel);outline-offset:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding:0 20px 40px;max-width:1000px;margin:0 auto}
.animal{background:var(--carte);border:1.5px solid var(--trait);border-radius:14px;padding:16px;cursor:pointer;text-align:start;width:100%;display:block;font-weight:400}
.animal:hover{border-color:var(--herbe-2)}
.animal .tete{display:flex;align-items:center;gap:12px}
.emoji{font-size:38px;line-height:1}
.animal h3{font-family:var(--titre);margin:0;font-size:20px}
.sous{color:var(--gris);font-size:14px}
.badge{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#eef2ea;color:var(--herbe)}
.badge.enc{background:#fbe4ec;color:#8f2c4d}
.vide{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--gris)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,35,28,.55)}
.modal{padding:22px}
.modal h2{font-family:var(--titre);margin:0 0 14px;font-size:24px}
.champ{margin-bottom:12px}
.champ label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.champ input,.champ select,.champ textarea{width:100%;padding:10px 12px;border:1.5px solid var(--trait);border-radius:10px;font:inherit;background:#fff}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bloc-enc{background:#fdf1f5;border:1.5px solid #f1cbd8;border-radius:12px;padding:12px;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .fin{margin-inline-start:auto}
.fiche dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:14px 0}
.fiche dt{color:var(--gris);font-size:14px}
.fiche dd{margin:0;font-weight:600}
.jauge{height:12px;background:#f3d9e2;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.jauge i{display:block;height:100%;background:var(--rose)}
.lien{background:none;border:0;padding:0;color:var(--ciel);text-decoration:underline;font-weight:700;cursor:pointer}
.petit{font-size:13px;color:var(--gris)}
footer{text-align:center;color:var(--gris);font-size:13px;padding:0 20px 30px}
.merci{text-align:center;font-family:"Cairo",Tahoma,sans-serif;font-size:22px;font-weight:700;color:var(--herbe);margin:0;padding:8px 20px 36px}
@media(max-width:480px){.deux{grid-template-columns:1fr}.fiche dl{grid-template-columns:110px 1fr}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="haut">
    <div>
      <h1 id="titre"></h1>
      <p id="sous-titre"></p>
    </div>
    <button id="langue" type="button"></button>
  </div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="barre">
  <input id="recherche" type="search">
  <select id="filtre"></select>
  <button class="btn-p" id="ajouter"></button>
</div>

<main class="grille" id="liste"></main>

<footer>
  <span id="pied"></span>
  <button class="lien" id="exporter"></button> ·
  <button class="lien" id="importer"></button>
  <input type="file" id="fichier" accept="application/json" hidden>
</footer>

<p class="merci" lang="ar" dir="rtl">الحمد لله، وكل شيء بفضل الله</p>

<dialog id="fiche"><div class="modal fiche" id="ficheContenu"></div></dialog>
<dialog id="formulaire"><form class="modal" id="form" method="dialog"></form></dialog>

<script>
/* ====== TEXTES (français / arabe) ====== */
const I18N = {
  fr:{
    titre:"Ferme de Popos & Mimi",
    sousTitre:"Un profil pour chaque animal : identité, famille, santé, gestation.",
    langueBtn:"العربية",
    recherche:"Chercher un nom, une race, un numéro…",
    toutes:"Toutes les espèces",
    ajouter:"+ Ajouter un animal",
    pied:"Les données sont gardées dans ce navigateur.",
    exporter:"Exporter (sauvegarde)", importer:"Importer",
    animaux:"animaux", enceinte:"enceinte", enceintes:"enceintes",
    aucun:"Aucun animal trouvé.<br>Clique sur « Ajouter un animal » pour créer le premier profil.",
    nouveau:"Nouvel animal", modifier:"Modifier",
    nom:"Nom *", espece:"Espèce", sexe:"Sexe", femelle:"Femelle", male:"Mâle", race:"Race",
    naissance:"Date de naissance", poids:"Poids (kg)", numero:"N° d'identification",
    mere:"Mère", pere:"Père", estEnceinte:"Est-elle enceinte ?", non:"Non", oui:"Oui",
    depuis:"Enceinte depuis (mois)", pereDuPetit:"Père du petit",
    sante:"Santé / vaccins", notes:"Notes", enregistrer:"Enregistrer", annuler:"Annuler",
    supprimer:"Supprimer", fermer:"Fermer",
    confirmSuppr:"Supprimer le profil de ", invalide:"Fichier invalide.",
    enceinteDepuis:"Enceinte depuis", sur:"sur", miseBas:"Mise bas dans environ", moisWord:"mois",
    ageInconnu:"Âge inconnu", dateInvalide:"Date invalide",
    kg:"kg", petits:"Petits", ageL:"Âge", naissL:"Naissance", numL:"N° d'identification", santeL:"Santé / vaccins",
    mois:n=>n+" mois", an:n=>n+(n>1?" ans":" an"), etMois:n=>" "+n+" mois",
    depuisMois:n=>n+" mois"
  },
  ar:{
    titre:"Ferme de Popos & Mimi",
    sousTitre:"ملف لكل حيوان: الهوية، العائلة، الصحة، الحمل.",
    langueBtn:"Français",
    recherche:"ابحث عن اسم، سلالة، رقم…",
    toutes:"كل الأنواع",
    ajouter:"+ إضافة حيوان",
    pied:"البيانات محفوظة في هذا المتصفح.",
    exporter:"تصدير (نسخة احتياطية)", importer:"استيراد",
    animaux:"حيوانات", enceinte:"حامل", enceintes:"حوامل",
    aucun:"لا يوجد أي حيوان.<br>اضغط على «إضافة حيوان» لإنشاء أول ملف.",
    nouveau:"حيوان جديد", modifier:"تعديل",
    nom:"الاسم *", espece:"النوع", sexe:"الجنس", femelle:"أنثى", male:"ذكر", race:"السلالة",
    naissance:"تاريخ الميلاد", poids:"الوزن (كغ)", numero:"رقم التعريف",
    mere:"الأم", pere:"الأب", estEnceinte:"هل هي حامل؟", non:"لا", oui:"نعم",
    depuis:"حامل منذ (أشهر)", pereDuPetit:"أب المولود",
    sante:"الصحة / التلقيحات", notes:"ملاحظات", enregistrer:"حفظ", annuler:"إلغاء",
    supprimer:"حذف", fermer:"إغلاق",
    confirmSuppr:"حذف ملف ", invalide:"ملف غير صالح.",
    enceinteDepuis:"حامل منذ", sur:"من أصل", miseBas:"الولادة بعد حوالي", moisWord:"أشهر",
    ageInconnu:"العمر غير معروف", dateInvalide:"تاريخ غير صالح",
    kg:"كغ", petits:"الصغار", ageL:"العمر", naissL:"الميلاد", numL:"رقم التعريف", santeL:"الصحة / التلقيحات",
    mois:n=>n===1?"شهر":n===2?"شهران":n<=10?n+" أشهر":n+" شهرا",
    an:n=>n===1?"سنة":n===2?"سنتان":n<=10?n+" سنوات":n+" سنة",
    etMois:n=>" و"+(n===1?"شهر":n===2?"شهران":n<=10?n+" أشهر":n+" شهرا"),
    depuisMois:n=>n===1?"شهر":n===2?"شهران":n<=10?n+" أشهر":n+" شهرا"
  }
};

/* ====== ESPÈCES ======
   Pour ajouter une espèce : ajoute une ligne (emoji, gestation en mois, noms fr/ar).
   sexe : "F" = toujours femelle, "M" = toujours mâle, "" = au choix */
const ESPECES = {
  vache:   {emoji:"🐄", gestation:9,  sexe:"F", fr:"Vache",   ar:"بقرة"},
  taureau: {emoji:"🐂", gestation:0,  sexe:"M", fr:"Taureau", ar:"ثور"},
  mouton:  {emoji:"🐑", gestation:0,  sexe:"M", fr:"Mouton (bélier)", ar:"خروف (كبش)"},
  brebis:  {emoji:"🐑", gestation:5,  sexe:"F", fr:"Brebis",  ar:"نعجة"},
  chevre:  {emoji:"🐐", gestation:5,  sexe:"",  fr:"Chèvre / Bouc", ar:"ماعز"},
  cheval:  {emoji:"🐴", gestation:11, sexe:"",  fr:"Cheval / Jument", ar:"حصان / فرس"},
  ane:     {emoji:"🫏", gestation:12, sexe:"",  fr:"Âne / Ânesse", ar:"حمار"},
  chameau: {emoji:"🐪", gestation:13, sexe:"",  fr:"Dromadaire", ar:"جمل"},
  poule:   {emoji:"🐔", gestation:0,  sexe:"",  fr:"Poule / Coq", ar:"دجاج"},
  autre:   {emoji:"🐾", gestation:0,  sexe:"",  fr:"Autre",   ar:"آخر"}
};
// Races de moutons du Maroc (tu peux en ajouter)
const RACES_MOUTON = [
  {fr:"Sardi", ar:"السردي"},
  {fr:"Timahdite", ar:"التيمحضيت"},
  {fr:"Béni Guil", ar:"بني كيل"},
  {fr:"D'man", ar:"الدمان"},
  {fr:"Boujaâd", ar:"بوجعد"},
  {fr:"Zoulay", ar:"الزولاي"}
];

const CLE = "ferme-animaux-v2";
let lang = "fr";
try{ lang = localStorage.getItem("ferme-langue") || "fr"; }catch(e){}
const t = k => I18N[lang][k];
let animaux = charger();

/* ====== DONNÉES ====== */
function normaliser(a){
  // accepte les anciennes données (noms français) et les convertit en codes
  if(!ESPECES[a.espece]){
    const trouve = Object.keys(ESPECES).find(k => ESPECES[k].fr.toLowerCase().startsWith(String(a.espece||"").toLowerCase()));
    a.espece = trouve || "autre";
  }
  if(a.sexe === "Femelle") a.sexe = "F";
  if(a.sexe === "Mâle") a.sexe = "M";
  if(a.sexe !== "F" && a.sexe !== "M") a.sexe = "F";
  return a;
}
function charger(){
  try{
    const d = JSON.parse(localStorage.getItem(CLE) || localStorage.getItem("ferme-animaux-v1"));
    if(Array.isArray(d)) return d.map(normaliser);
  }catch(e){}
  return exemples();
}
function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(animaux)); }catch(e){} }
function exemples(){
  return [
    {id:"1",nom:"Rania",espece:"vache",sexe:"F",race:"Holstein",naissance:"2020-03-12",poids:520,numero:"MA-0001",mere:"",pere:"",enceinte:true,moisGestation:6,pereDuPetit:"Atlas",sante:"",notes:""},
    {id:"2",nom:"Atlas",espece:"taureau",sexe:"M",race:"Holstein",naissance:"2019-01-20",poids:890,numero:"MA-0002",mere:"",pere:"",enceinte:false,moisGestation:0,pereDuPetit:"",sante:"",notes:""},
    {id:"3",nom:"Lalla",espece:"brebis",sexe:"F",race:"Sardi",naissance:"2023-02-10",poids:60,numero:"MA-0003",mere:"",pere:"",enceinte:true,moisGestation:3,pereDuPetit:"",sante:"",notes:""}
  ];
}

/* ====== OUTILS ====== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esp = a => ESPECES[a.espece] || ESPECES.autre;
const nomEsp = code => ESPECES[code][lang];
const nomSexe = s => s === "M" ? t("male") : t("femelle");
const racesMouton = () => RACES_MOUTON.map(r => r[lang]);

function age(naissance){
  if(!naissance) return t("ageInconnu");
  const n = new Date(naissance), auj = new Date();
  let mois = (auj.getFullYear()-n.getFullYear())*12 + auj.getMonth()-n.getMonth();
  if(auj.getDate() < n.getDate()) mois--;
  if(mois < 0) return t("dateInvalide");
  if(mois < 12) return t("mois")(mois);
  const ans = Math.floor(mois/12), reste = mois % 12;
  return t("an")(ans) + (reste ? t("etMois")(reste) : "");
}
function petitsDe(a){
  return animaux.filter(x => x.id !== a.id && (
    (x.mere && x.mere.toLowerCase() === a.nom.toLowerCase()) ||
    (x.pere && x.pere.toLowerCase() === a.nom.toLowerCase())));
}

/* ====== LANGUE ====== */
function appliquerLangue(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("titre");
  $("#titre").textContent = t("titre");
  $("#sous-titre").textContent = t("sousTitre");
  $("#langue").textContent = t("langueBtn");
  $("#recherche").placeholder = t("recherche");
  $("#ajouter").textContent = t("ajouter");
  $("#pied").textContent = t("pied") + " ";
  $("#exporter").textContent = t("exporter");
  $("#importer").textContent = t("importer");
  $("#fiche").close(); $("#formulaire").close();
  afficher();
}
$("#langue").onclick = () => {
  lang = lang === "fr" ? "ar" : "fr";
  try{ localStorage.setItem("ferme-langue", lang); }catch(e){}
  appliquerLangue();
};

/* ====== LISTE ====== */
function afficher(){
  const q = $("#recherche").value.trim().toLowerCase();
  const f = $("#filtre").value;
  const res = animaux.filter(a =>
    (!f || a.espece === f) &&
    (!q || [a.nom,a.race,a.numero,nomEsp(a.espece)].join(" ").toLowerCase().includes(q)));

  $("#liste").innerHTML = res.length ? res.map(a => `
    <button class="animal" data-id="${esc(a.id)}">
      <div class="tete"><span class="emoji" aria-hidden="true">${esp(a).emoji}</span>
        <div><h3>${esc(a.nom)}</h3><div class="sous">${esc(nomEsp(a.espece))}${a.race?" · "+esc(a.race):""} · ${esc(age(a.naissance))}</div></div>
      </div>
      ${a.enceinte ? `<span class="badge enc">${t("enceinteDepuis")} ${esc(t("depuisMois")(Number(a.moisGestation)))}</span>` : `<span class="badge">${esc(nomSexe(a.sexe))}</span>`}
    </button>`).join("")
    : `<div class="vide">${t("aucun")}</div>`;

  const nbEnc = animaux.filter(a => a.enceinte).length;
  $("#stats").innerHTML = `<div class="stat"><b>${animaux.length}</b>${t("animaux")}</div><div class="stat"><b>${nbEnc}</b>${nbEnc>1?t("enceintes"):t("enceinte")}</div>`;

  const utilises = [...new Set(animaux.map(a => a.espece))];
  const cur = $("#filtre").value;
  $("#filtre").innerHTML = `<option value="">${t("toutes")}</option>` + utilises.map(e => `<option value="${e}" ${e===cur?"selected":""}>${esc(nomEsp(e))}</option>`).join("");
}

/* ====== FICHE ====== */
function ouvrirFiche(id){
  const a = animaux.find(x => x.id === id); if(!a) return;
  const total = esp(a).gestation || 9;
  const pct = Math.min(100, Math.round((a.moisGestation/total)*100));
  const restant = Math.max(0, total - a.moisGestation);
  const petits = petitsDe(a);
  const ligne = (l,v) => v ? `<dt>${l}</dt><dd>${v}</dd>` : "";
  $("#ficheContenu").innerHTML = `
    <div style="display:flex;gap:12px;align-items:center">
      <span class="emoji" aria-hidden="true">${esp(a).emoji}</span>
      <div><h2 style="margin:0">${esc(a.nom)}</h2><div class="sous">${esc(nomEsp(a.espece))}${a.race?" · "+esc(a.race):""}</div></div>
    </div>
    ${a.enceinte ? `<div class="bloc-enc" style="margin-top:14px">
       <b>${t("enceinteDepuis")} ${esc(t("depuisMois")(Number(a.moisGestation)))}</b> (${t("sur")} ${total} ${t("moisWord")})
       <div class="jauge"><i style="width:${pct}%"></i></div>
       <div class="petit">${t("miseBas")} ${restant} ${t("moisWord")}${a.pereDuPetit?" · "+t("pereDuPetit")+" : <b>"+esc(a.pereDuPetit)+"</b>":""}</div>
     </div>` : ""}
    <dl>
      ${ligne(t("sexe"), esc(nomSexe(a.sexe)))}
      ${ligne(t("ageL"), esc(age(a.naissance)))}
      ${ligne(t("naissL"), a.naissance ? new Date(a.naissance).toLocaleDateString(lang==="ar"?"ar-MA-u-nu-latn":"fr-FR") : "")}
      ${ligne(t("poids").replace(/ \(.*\)/,""), a.poids ? esc(a.poids)+" "+t("kg") : "")}
      ${ligne(t("numL"), esc(a.numero))}
      ${ligne(t("mere"), esc(a.mere))}
      ${ligne(t("pere"), esc(a.pere))}
      ${ligne(t("santeL"), esc(a.sante))}
      ${ligne(t("notes"), esc(a.notes))}
      ${petits.length ? `<dt>${t("petits")}</dt><dd>${petits.map(p => `<button class="lien" data-id="${esc(p.id)}">${esc(p.nom)}</button>`).join(lang==="ar"?"، ":", ")}</dd>` : ""}
    </dl>
    <div class="actions">
      <button class="btn-p" id="modif">${t("modifier")}</button>
      <button class="btn-d" id="suppr">${t("supprimer")}</button>
      <button class="btn-s fin" id="fermer">${t("fermer")}</button>
    </div>`;
  $("#fiche").showModal();
  $("#modif").onclick = () => { $("#fiche").close(); ouvrirFormulaire(a); };
  $("#suppr").onclick = () => {
    if(confirm(t("confirmSuppr") + a.nom + " ?")){
      animaux = animaux.filter(x => x.id !== a.id); sauver(); $("#fiche").close(); afficher();
    }
  };
  $("#fermer").onclick = () => $("#fiche").close();
}

/* ====== FORMULAIRE ====== */
function ouvrirFormulaire(a){
  const nouveau = !a;
  a = a || {id:String(Date.now()),nom:"",espece:"vache",sexe:"F",race:"",naissance:"",poids:"",numero:"",mere:"",pere:"",enceinte:false,moisGestation:0,pereDuPetit:"",sante:"",notes:""};
  const noms = animaux.filter(x => x.id !== a.id).map(x => `<option value="${esc(x.nom)}">`).join("");
  $("#form").innerHTML = `
    <h2>${nouveau ? t("nouveau") : t("modifier") + " " + esc(a.nom)}</h2>
    <div class="deux">
      <div class="champ"><label for="f-nom">${t("nom")}</label><input id="f-nom" required value="${esc(a.nom)}"></div>
      <div class="champ"><label for="f-espece">${t("espece")}</label><select id="f-espece">${Object.keys(ESPECES).map(k => `<option value="${k}" ${k===a.espece?"selected":""}>${esc(nomEsp(k))}</option>`).join("")}</select></div>
      <div class="champ"><label for="f-sexe">${t("sexe")}</label><select id="f-sexe"><option value="F" ${a.sexe==="F"?"selected":""}>${t("femelle")}</option><option value="M" ${a.sexe==="M"?"selected":""}>${t("male")}</option></select></div>
      <div class="champ"><label for="f-race">${t("race")}</label><input id="f-race" list="races" value="${esc(a.race)}"></div>
      <div class="champ"><label for="f-naissance">${t("naissance")}</label><input id="f-naissance" type="date" value="${esc(a.naissance)}"></div>
      <div class="champ"><label for="f-poids">${t("poids")}</label><input id="f-poids" type="number" min="0" value="${esc(a.poids)}"></div>
      <div class="champ"><label for="f-numero">${t("numero")}</label><input id="f-numero" value="${esc(a.numero)}"></div>
      <div></div>
      <div class="champ"><label for="f-mere">${t("mere")}</label><input id="f-mere" list="noms" value="${esc(a.mere)}"></div>
      <div class="champ"><label for="f-pere">${t("pere")}</label><input id="f-pere" list="noms" value="${esc(a.pere)}"></div>
    </div>
    <datalist id="noms">${noms}</datalist>
    <datalist id="races"></datalist>

    <div class="bloc-enc" id="bloc-enc">
      <div class="champ"><label for="f-enceinte">${t("estEnceinte")}</label>
        <select id="f-enceinte"><option value="non">${t("non")}</option><option value="oui" ${a.enceinte?"selected":""}>${t("oui")}</option></select></div>
      <div class="deux" id="det-enc">
        <div class="champ"><label for="f-mois">${t("depuis")}</label><input id="f-mois" type="number" min="0" max="14" step="0.5" value="${esc(a.moisGestation)}"></div>
        <div class="champ"><label for="f-pdp">${t("pereDuPetit")}</label><input id="f-pdp" list="noms" value="${esc(a.pereDuPetit)}"></div>
      </div>
    </div>

    <div class="champ"><label for="f-sante">${t("sante")}</label><textarea id="f-sante" rows="2">${esc(a.sante)}</textarea></div>
    <div class="champ"><label for="f-notes">${t("notes")}</label><textarea id="f-notes" rows="2">${esc(a.notes)}</textarea></div>
    <div class="actions">
      <button class="btn-p" type="submit">${t("enregistrer")}</button>
      <button class="btn-s" type="button" id="annuler">${t("annuler")}</button>
    </div>`;

  const maj = () => {
    const e = ESPECES[$("#f-espece").value];
    const femelle = $("#f-sexe").value === "F";
    $("#bloc-enc").style.display = (femelle && e.gestation > 0) ? "" : "none";
    $("#det-enc").style.display = $("#f-enceinte").value === "oui" ? "" : "none";
    const moutons = ["mouton","brebis"].includes($("#f-espece").value);
    $("#races").innerHTML = moutons ? racesMouton().map(r => `<option value="${esc(r)}">`).join("") : "";
  };
  $("#f-espece").onchange = () => {
    const e = ESPECES[$("#f-espece").value];
    if(e.sexe) $("#f-sexe").value = e.sexe;
    maj();
  };
  $("#f-sexe").onchange = $("#f-enceinte").onchange = maj; maj();
  $("#annuler").onclick = () => $("#formulaire").close();

  $("#form").onsubmit = e => {
    e.preventDefault();
    const sp = ESPECES[$("#f-espece").value];
    const enc = $("#f-sexe").value === "F" && sp.gestation > 0 && $("#f-enceinte").value === "oui";
    const nv = {
      id:a.id, nom:$("#f-nom").value.trim(), espece:$("#f-espece").value, sexe:$("#f-sexe").value,
      race:$("#f-race").value.trim(), naissance:$("#f-naissance").value, poids:$("#f-poids").value,
      numero:$("#f-numero").value.trim(), mere:$("#f-mere").value.trim(), pere:$("#f-pere").value.trim(),
      enceinte:enc, moisGestation: enc ? Number($("#f-mois").value)||0 : 0,
      pereDuPetit: enc ? $("#f-pdp").value.trim() : "",
      sante:$("#f-sante").value.trim(), notes:$("#f-notes").value.trim()
    };
    if(!nv.nom) return;
    const i = animaux.findIndex(x => x.id === a.id);
    if(i >= 0) animaux[i] = nv; else animaux.push(nv);
    sauver(); $("#formulaire").close(); afficher();
  };
  $("#formulaire").showModal();
}

/* ====== ÉVÉNEMENTS ====== */
$("#ajouter").onclick = () => ouvrirFormulaire();
$("#recherche").oninput = afficher;
$("#filtre").onchange = afficher;
$("#liste").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if(b) ouvrirFiche(b.dataset.id); });
$("#ficheContenu").addEventListener("click", e => { const b = e.target.closest(".lien[data-id]"); if(b){ $("#fiche").close(); ouvrirFiche(b.dataset.id); } });

$("#exporter").onclick = () => {
  const blob = new Blob([JSON.stringify(animaux,null,2)], {type:"application/json"});
  const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = "ferme-sauvegarde.json"; l.click();
};
$("#importer").onclick = () => $("#fichier").click();
$("#fichier").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      animaux = d.map(normaliser); sauver(); afficher();
    }catch(err){ alert(t("invalide")); }
  };
  r.readAsText(f);
};

appliquerLangue();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
